<!DOCTYPE html><html class="dark" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Vault Logic - Secure Login</title>

<style>

        }

            overflow: hidden;
            white-space: nowrap;
        }

        @keyframes scan-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .scanning-ring {
            animation: scan-rotate 8s linear infinite;
        }

        .cyber-glow {
            box-shadow: 0 0 15px rgba(190, 245, 0, 0.2);
        }

        .auth-gradient {
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
        }
    </style>

                    "secondary-fixed": "#bef500",
                    "on-background": "#e5e2e1",
                    "tertiary-fixed-dim": "#bbc3ff",
                    "surface-variant": "#353534",
                    "on-tertiary-container": "#8290f4",
                    "error-container": "#93000a",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#c6c5d4",
                    "on-secondary-fixed-variant": "#3a4d00",
                    "outline": "#908f9d",
                    "on-secondary-fixed": "#151f00",
                    "on-surface": "#e5e2e1",
                    "on-tertiary": "#112286",
                    "background": "#131313",
                    "on-error": "#690005",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed-dim": "#a6d700",
                    "primary-fixed-dim": "#bdc2ff",
                    "surface-container-low": "#1c1b1b",
                    "surface-container-highest": "#353534",
                    "primary": "#bdc2ff",
                    "on-primary": "#1b247f",
                    "outline-variant": "#454652",
                    "on-primary-fixed-variant": "#343d96",
                    "surface": "#131313",
                    "on-secondary-container": "#536d00",
                    "surface-container-high": "#2a2a2a",
                    "surface-tint": "#bdc2ff",
                    "inverse-surface": "#e5e2e1",

                    "on-tertiary-fixed-variant": "#2d3c9c",
                    "inverse-on-surface": "#313030",
                    "surface-container": "#201f1f",
                    "tertiary": "#bbc3ff",
                    "on-primary-container": "#8690ee",
                    "tertiary-fixed": "#dfe0ff",
                    "inverse-primary": "#4c56af",
                    "primary-fixed": "#e0e0ff",

                    "surface-dim": "#131313",
                    "on-primary-fixed": "#000767",

            "spacing": {

<body class="bg-background text-on-surface flex flex-col min-h-screen items-center justify-center font-body-md overflow-hidden">
<!-- Ambient Visual Layer -->
<div class="fixed inset-0 pointer-events-none z-0">

</div>
<!-- Main Content Canvas (Transactional/Focused) -->
<main class="relative z-10 w-full max-w-[420px] px-container-padding flex flex-col items-center">
<!-- Brand Header (Simplified for Login) -->
<header class="mb-xl flex flex-col items-center">
<div class="w-16 h-16 rounded-full border border-secondary-fixed/30 flex items-center justify-center mb-md cyber-glow">
<span class="material-symbols-outlined text-secondary-fixed-dim text-[40px]">shield_lock</span>
</div>
<h2 class="font-mono-code text-label-md tracking-widest text-secondary-fixed-dim uppercase mb-base">VAULT LOGIC</h2>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Bienvenido de nuevo</h1>
</header>
<!-- Login Container (Level 1 Surface) -->
<div class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-lg space-y-lg relative overflow-hidden">
<!-- Hex Stream Indicator (Decorative) -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-container-highest flex overflow-hidden">
<div class="hex-stream-text text-[8px] text-secondary-fixed-dim/40 whitespace-nowrap px-1" id="hex-stream">5DC96C92D4A8E39EC9F06F54D411594AD84B7A632E5E1F3A3E</div>
</div>
<!-- Identifier Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="identifier">Identificador de Usuario</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg h-14 px-md font-body-md focus:border-secondary-fixed-dim focus:ring-0 transition-colors outline-none placeholder:text-outline/50" id="identifier" placeholder="Email o ID de seguridad" type="text">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary-fixed-dim transition-colors">fingerprint</span>
</div>
</div>
<!-- Security Key Action -->
<div class="space-y-md">
<button class="w-full h-14 bg-secondary-container text-on-secondary-container font-headline-lg-mobile text-headline-lg-mobile rounded-full flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150 hover:bg-secondary-fixed shadow-lg shadow-secondary-fixed/10" id="auth-button">
<span class="material-symbols-outlined">vpn_key</span>
<span class="">Iniciar Sesión con Llave de Seguridad</span>
</button>

</div>
<!-- Biometric Scanning State (Hidden initially) -->
<div class="hidden flex flex-col items-center py-md animate-pulse" id="scanning-state">
<div class="relative w-20 h-20 mb-md">
<div class="scanning-ring absolute inset-0 border-2 border-dashed border-secondary-fixed-dim rounded-full"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed text-[32px]">face</span>
</div>
</div>
<div class="flex flex-col items-center">
<span class="font-mono-code text-label-md text-secondary-fixed-dim">CHALLENGE_IN_PROGRESS</span>
<svg class="w-24 h-8 text-primary" id="pulse-wave" viewBox="0 0 100 20">
<path d="M0 10 Q 12.5 13.884995916722211, 25 10 T 50 15.463099533557068 T 75 6.5980595500727395 T 100 10" fill="transparent" id="wave-path" stroke="currentColor" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="mt-xl flex flex-col items-center space-y-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                ¿Aún no tienes acceso?
            </p>
<a class="font-label-md text-label-md text-secondary-fixed-dim hover:text-secondary-fixed transition-colors border-b border-secondary-fixed-dim/30 pb-0.5" href="#">
                CREAR CUENTA
            </a>
<div class="flex items-center gap-xs pt-xl">
<div class="w-1.5 h-1.5 bg-secondary-fixed rounded-full"></div>
<span class="font-mono-code text-[10px] text-on-surface-variant tracking-[0.2em]">ENCRYPTED SESSION ACTIVE</span>
</div>
</footer>
</main>
<script>
        // Hex Stream Generator
        const hexStream = document.getElementById('hex-stream');
        function updateHex() {
            let result = '';
            const characters = '0123456789ABCDEF';
            for (let i = 0; i < 50; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            hexStream.textContent = result;
        }
        setInterval(updateHex, 100);

        // Sine Wave Animation Logic
        const wavePath = document.getElementById('wave-path');
        let counter = 0;
        function animateWave() {
            counter += 0.1;
            const y1 = 10 + Math.sin(counter) * 5;
            const y2 = 10 + Math.sin(counter + 1.5) * 8;
            const y3 = 10 + Math.sin(counter + 3) * 5;
            wavePath.setAttribute('d', `M0 10 Q 12.5 ${y1}, 25 10 T 50 ${y2} T 75 ${y3} T 100 10`);
            requestAnimationFrame(animateWave);
        }
        animateWave();

        // Interaction Simulation
        const authButton = document.getElementById('auth-button');
        const scanningState = document.getElementById('scanning-state');
        const pulseWave = document.getElementById('pulse-wave');

        authButton.addEventListener('click', () => {
            const input = document.getElementById('identifier');
            if (input.value.trim() === '') {
                input.classList.add('border-error');
                setTimeout(() => input.classList.remove('border-error'), 1000);
                return;
            }

            authButton.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span><span>Verificando...</span>';
            authButton.disabled = true;
            authButton.classList.add('opacity-50');
            
            setTimeout(() => {
                scanningState.classList.remove('hidden');
                scanningState.scrollIntoView({ behavior: 'smooth' });
                
                // Change wave to success pulse after 2 seconds
                setTimeout(() => {
                    pulseWave.classList.remove('text-primary');
                    pulseWave.classList.add('text-secondary-fixed');
                    scanningState.innerHTML = `
                        <div class="flex flex-col items-center animate-bounce">
                            <span class="material-symbols-outlined text-secondary-fixed text-4xl mb-2">verified_user</span>
                            <span class="font-mono-code text-label-md text-secondary-fixed">SIGNATURE_VERIFIED</span>
                        </div>
                    `;
                }, 2000);
            }, 800);
        });
    </script>


</body></html>
