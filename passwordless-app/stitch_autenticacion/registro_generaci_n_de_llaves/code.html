<!-- Script for interaction simulations -->
<script>
        // Hex Stream Animation
        const hexDisplay = document.getElementById('hexDisplay');
        const chars = '0123456789ABCDEF';
        const algos = ['Generating RSA-2048', 'Generating ECDSA-P256', 'Signing Handshake', 'Finalizing Identity'];
        const statusBadge = document.getElementById('statusBadge');
        const algoStatus = document.getElementById('algoStatus');
        let progress = 0;

        function updateHex() {
            let result = '0x';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            result += '...' + chars.charAt(Math.floor(Math.random() * chars.length)) + chars.charAt(Math.floor(Math.random() * chars.length));
            hexDisplay.innerText = result;
        }

        const hexInterval = setInterval(updateHex, 100);

        // Sine Wave Animation Logic
        const path = document.querySelector('#signatureWave path');
        let t = 0;
        function animateWave() {
            t += 0.1;
            let d = "M0 20";
            for (let x = 0; x <= 100; x += 5) {
                let y = 20 + Math.sin(x * 0.1 + t) * 10;
                d += ` L ${x} ${y}`;
            }
            path.setAttribute('d', d);
            requestAnimationFrame(animateWave);
        }
        animateWave();

        // Step through algorithms
        let algoIndex = 0;
        const algoInterval = setInterval(() => {
            algoIndex++;
            if (algoIndex < algos.length) {
                algoStatus.innerText = algos[algoIndex];
            } else {
                clearInterval(algoInterval);
                algoStatus.innerText = "Ready for Authorization";
                statusBadge.innerText = "KEY READY";
                statusBadge.className = "font-mono-code text-label-md text-primary bg-primary/10 px-2 py-0.5 rounded";
            }
        }, 2000);

        // Biometric Button Action
        const bioBtn = document.getElementById('biometricBtn');
        const successOverlay = document.getElementById('successOverlay');

        bioBtn.addEventListener('click', () => {
            // Change UI to signing state
            bioBtn.classList.add('opacity-50', 'pointer-events-none');
            algoStatus.innerText = "Signing Public Key...";
            path.classList.remove('stroke-primary');
            path.classList.add('stroke-secondary-fixed');
            
            // Simulate processing
            setTimeout(() => {
                clearInterval(hexInterval);
                hexDisplay.innerText = "0x" + Array.from({length:8}, () => chars.charAt(Math.floor(Math.random()*16))).join('');
                hexDisplay.classList.remove('text-primary');
                hexDisplay.classList.add('text-secondary-fixed');
                
                setTimeout(() => {
                    successOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    successOverlay.classList.add('opacity-100');
                }, 800);
            }, 1500);
        });
    </script>
