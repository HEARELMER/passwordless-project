<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Vault Logic | Authentication Challenge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .hex-flicker {
            animation: flicker 0.15s infinite alternate;
        }
        
        @keyframes flicker {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .scanning-ring {
            border: 2px dashed #bdc2ff;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sine-wave-container {
            height: 40px;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        .glass-panel {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #333333;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-container": "#8290f4",
                      "background": "#131313",
                      "outline-variant": "#454652",
                      "surface-container-low": "#1c1b1b",
                      "tertiary-container": "#102285",
                      "on-tertiary-fixed-variant": "#2d3c9c",
                      "on-primary-fixed": "#000767",
                      "tertiary": "#bbc3ff",
                      "on-tertiary": "#112286",
                      "surface-variant": "#353534",
                      "on-background": "#e5e2e1",
                      "on-secondary-fixed-variant": "#3a4d00",
                      "surface": "#131313",
                      "surface-dim": "#131313",
                      "secondary-container": "#bef500",
                      "inverse-primary": "#4c56af",
                      "surface-tint": "#bdc2ff",
                      "error-container": "#93000a",
                      "on-error": "#690005",
                      "on-secondary": "#273500",
                      "tertiary-fixed-dim": "#bbc3ff",
                      "secondary-fixed": "#bef500",
                      "secondary": "#ffffff",
                      "primary-container": "#1a237e",
                      "primary-fixed": "#e0e0ff",
                      "on-error-container": "#ffdad6",
                      "surface-container-highest": "#353534",
                      "primary-fixed-dim": "#bdc2ff",
                      "surface-container": "#201f1f",
                      "surface-bright": "#393939",
                      "on-primary": "#1b247f",
                      "surface-container-lowest": "#0e0e0e",
                      "surface-container-high": "#2a2a2a",
                      "tertiary-fixed": "#dfe0ff",
                      "on-tertiary-fixed": "#000d5f",
                      "error": "#ffb4ab",
                      "secondary-fixed-dim": "#a6d700",
                      "inverse-on-surface": "#313030",
                      "on-primary-container": "#8690ee",
                      "on-secondary-fixed": "#151f00",
                      "on-surface": "#e5e2e1",
                      "outline": "#908f9d",
                      "on-surface-variant": "#c6c5d4",
                      "primary": "#bdc2ff",
                      "on-secondary-container": "#536d00",
                      "inverse-surface": "#e5e2e1",
                      "on-primary-fixed-variant": "#343d96"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "sm": "12px",
                      "lg": "24px",
                      "md": "16px",
                      "base": "4px",
                      "container-padding": "20px",
                      "xl": "32px",
                      "gutter": "16px",
                      "xs": "8px"
              },
              "fontFamily": {
                      "body-sm": ["Inter"],
                      "mono-code": ["Geist"],
                      "display-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-md": ["Geist"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "mono-code": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                      "display-sm": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Top App Bar (From Shared Components) -->
<header class="bg-background fixed top-0 w-full z-50 border-b border-outline-variant flex justify-between items-center h-16 px-container-padding">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Vault Logic</h1>
</div>
<div class="flex items-center gap-md">
<button class="hover:bg-surface-variant/50 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant">security</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="min-h-screen pt-16 pb-20 flex flex-col items-center justify-center relative overflow-hidden px-container-padding">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20">

</div>
<!-- Authentication Challenge Modal -->
<div class="glass-panel w-full max-w-md rounded-xl p-lg relative z-10 shadow-2xl flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-start">
<span class="font-mono-code text-label-md text-primary tracking-widest uppercase">CHALLENGE RECEIVED</span>
<span class="font-mono-code text-label-md text-on-surface-variant opacity-60">ID: VL-992-QX</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-secondary">Authorize Access</h2>
</div>
<!-- Requestor Info Card -->
<div class="bg-surface-container rounded-lg p-md border border-outline-variant/30 flex flex-col gap-xs">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-body-md">language</span>
<span class="font-body-sm text-on-surface-variant">Login attempt from:</span>
</div>
<p class="font-body-md text-on-surface font-semibold">Corporate Admin Portal</p>
<div class="flex items-center gap-xs mt-1">
<span class="font-mono-code text-label-md text-on-surface-variant bg-surface-variant/50 px-2 py-0.5 rounded">Chrome</span>
<span class="font-mono-code text-label-md text-on-surface-variant bg-surface-variant/50 px-2 py-0.5 rounded">Windows 11</span>
</div>
</div>
<!-- Challenge Data / Nonce -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-container uppercase">Nonce / Challenge</label>
<div class="bg-surface-container-lowest p-md border border-primary/20 rounded flex items-center justify-between">
<code class="font-mono-code text-mono-code text-primary-fixed-dim hex-flicker truncate pr-4" id="nonce-display">0xEAAF...7CD367A5</code>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer text-body-sm">content_copy</span>
</div>
</div>
<!-- Signature Visualization -->
<div class="sine-wave-container flex items-center justify-center w-full bg-surface-container-low rounded-lg border border-outline-variant/20">
<svg class="w-full h-full stroke-primary fill-none opacity-60" id="sine-wave" viewBox="0 0 400 40">
<path d="M 0 20 Q 50 5, 100 20 T 200 20 T 300 20 T 400 20" stroke-width="1.5">
<animate attributeName="d" dur="2s" repeatCount="indefinite" values="M 0 20 Q 50 5, 100 20 T 200 20 T 300 20 T 400 20;
                                    M 0 20 Q 50 35, 100 20 T 200 20 T 300 20 T 400 20;
                                    M 0 20 Q 50 5, 100 20 T 200 20 T 300 20 T 400 20"></animate>
</path>
</svg>
</div>
<!-- Biometric Interaction Zone -->
<div class="flex flex-col items-center gap-md py-md">
<div class="relative flex items-center justify-center">
<div class="scanning-ring w-20 h-20 rounded-full absolute"></div>
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-primary transition-all duration-300 hover:scale-110 active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile rounded-full flex items-center justify-center gap-sm transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined">verified_user</span>
                    Approve with Biometrics
                </button>
<button class="w-full py-2 text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors">Reject</button>
</div>
<!-- Security Footer -->

</div>
</main>
<!-- Bottom Nav Bar (From Shared Components) -->
<!-- Suppression logic: Screen is a focused challenge, but for the purpose of the template layout we demonstrate the placement if this were a dashboard sub-view. If the goal was full suppression we would hide it, but here we include it to show the theme alignment. -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe bg-surface-container border-t border-outline-variant z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security_update_good</span>
<span class="font-label-md text-label-md">Devices</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined">history_edu</span>
<span class="font-label-md text-label-md">Logs</span>
</a>
</nav>
<script>
        // Micro-interaction for Hex Nonce flickering
        const nonceEl = document.getElementById('nonce-display');
        const hexChars = '0123456789ABCDEF';
        
        setInterval(() => {
            let result = '0x';
            for (let i = 0; i < 4; i++) {
                result += hexChars[Math.floor(Math.random() * 16)];
            }
            result += '...';
            for (let i = 0; i < 8; i++) {
                result += hexChars[Math.floor(Math.random() * 16)];
            }
            nonceEl.textContent = result;
        }, 100);

        // Simulated Success State on Button Click
        const authBtn = document.querySelector('button.bg-primary-container');
        authBtn.addEventListener('click', () => {
            authBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
            authBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            authBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> AUTHORIZED';
            
            // Flatten sine wave
            const wave = document.querySelector('#sine-wave path animate');
            if(wave) wave.setAttribute('dur', '0.2s');
            
            const ring = document.querySelector('.scanning-ring');
            ring.style.borderColor = '#bef500';
            ring.style.animationDuration = '1s';
        });
    </script>


</body></html>
